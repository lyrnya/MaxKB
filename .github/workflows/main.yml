name: Docker Build from Table Branch

on:
  workflow_dispatch:

env:
  IMAGE_NAME: maxkb-v2.0
  BRANCH_NAME: table

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: table

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull base images
        run: |
          docker pull library/node:24-alpine
          docker pull ghcr.io/1panel-dev/maxkb-base:python3.11-pg17.11-20260818

      - name: Build Docker image
        run: |
          docker build -t ${IMAGE_NAME}:latest -f installer/Dockerfile .
          docker tag ${IMAGE_NAME}:latest ${IMAGE_NAME}:${BRANCH_NAME}-latest
          docker tag ${IMAGE_NAME}:latest ${IMAGE_NAME}:${BRANCH_NAME}-${{ github.sha }}

      - name: Export Docker image
        run: |
          # 根据触发类型决定导出文件名
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            EXPORT_FILE="${IMAGE_NAME}-${VERSION}-${BRANCH_NAME}.tar"
            docker tag ${IMAGE_NAME}:latest ${IMAGE_NAME}:${VERSION}
            docker save -o ${EXPORT_FILE} ${IMAGE_NAME}:${VERSION}
          else
            EXPORT_FILE="${IMAGE_NAME}-${BRANCH_NAME}-latest.tar"
            docker save -o ${EXPORT_FILE} ${IMAGE_NAME}:${BRANCH_NAME}-latest
          fi
          echo "EXPORT_FILE=${EXPORT_FILE}" >> $GITHUB_ENV
          
          # 压缩
          gzip -c ${EXPORT_FILE} > ${EXPORT_FILE}.gz
          sha256sum ${EXPORT_FILE}.gz > ${EXPORT_FILE}.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-from-table
          path: |
            ${{ env.EXPORT_FILE }}.gz
            ${{ env.EXPORT_FILE }}.gz.sha256
          retention-days: 7

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.EXPORT_FILE }}.gz
            ${{ env.EXPORT_FILE }}.gz.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
